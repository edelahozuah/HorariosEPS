name: Desplegar web en GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copiar los datos abiertos a web/data/ (sin profesores.csv)
        run: |
          mkdir -p web/data
          cp data/*.csv data/*.json web/data/
          rm -f web/data/profesores.csv
          cp LICENSE-DATA web/data/LICENSE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
